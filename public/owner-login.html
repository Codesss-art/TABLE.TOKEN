<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner & Kitchen Login - TableToken</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-container {
      max-width: 440px;
      margin: 48px auto;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px 28px;
      box-shadow: var(--shadow-xl);
    }
    .owner-icon-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #e0e7ff;
      color: #4338ca;
      font-size: 2.4rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="brand">
        <span class="brand-icon">🍽️</span>
        <div class="brand-text">
          <h1>TableToken</h1>
          <p>Kitchen Command Center</p>
        </div>
      </div>
      <a href="/" class="btn btn-outline btn-sm">Home</a>
    </div>
  </header>

  <main class="container">
    <div class="login-container">
      <div style="text-align: center;">
        <div class="owner-icon-circle">👨‍🍳</div>
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; color: var(--text-main);">
          Owner Sign In
        </h2>
        <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 24px;">
          Access your live kitchen board, table QR codes, and sales analytics.
        </p>
      </div>

      <form id="ownerLoginForm" onsubmit="handleOwnerLogin(event)">
        <!-- Phone Number -->
        <div class="form-group">
          <label class="form-label" for="loginPhone">Phone Number *</label>
          <input type="tel" id="loginPhone" class="form-input" placeholder="10-digit mobile number" maxlength="10" pattern="[6-9][0-9]{9}" required autofocus>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password *</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required>
        </div>

        <div id="loginErrorMsg" style="display: none; color: #dc2626; font-size: 0.85rem; font-weight: 600; margin-bottom: 14px; background: #fee2e2; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid #fecaca;"></div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-lg" style="margin-top: 10px;">
          Sign In to Dashboard &rarr;
        </button>
      </form>

      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 0.85rem; color: var(--text-muted);">
        Need to display orders on your counter TV?
        <div style="margin-top: 8px;">
          <a href="/display" class="btn btn-outline btn-sm" target="_blank" style="font-weight: 700;">
            📺 Open TV Display (No Login Required)
          </a>
        </div>
      </div>
    </div>
  </main>

  <script>
    async function handleOwnerLogin(e) {
      e.preventDefault();
      const phoneInput = document.getElementById('loginPhone');
      const passInput = document.getElementById('loginPassword');
      const errEl = document.getElementById('loginErrorMsg');
      const btn = document.getElementById('loginBtn');

      const phone = phoneInput.value.trim().replace(/\D/g, '');
      const password = passInput.value;

      if (!/^[6-9]\d{9}$/.test(phone)) {
        errEl.innerText = 'Please enter a valid 10-digit Indian phone number.';
        errEl.style.display = 'block';
        phoneInput.focus();
        return;
      }

      errEl.style.display = 'none';
      btn.disabled = true;
      btn.innerText = 'Verifying credentials...';

      try {
        const res = await fetch('/api/owner/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });

        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect || '/owner';
        } else {
          errEl.innerText = data.error || 'Invalid phone or password.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.innerText = 'Sign In to Dashboard →';
        }
      } catch (err) {
        errEl.innerText = 'Network error. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Sign In to Dashboard →';
      }
    }
  </script>
</body>
</html>
